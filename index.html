const conflictMessage = list => html`<p style="margin:0 0 10px">Já existe aula neste horário:</p><ul style="margin:0 0 10px;padding-left:20px">${list.slice(0, 8).map(x => html`<li><b>${fmtDate(x.d)}</b> ${x.c.time}–${minToTime(timeToMin(x.c.time) + (Number(x.c.duration) || 60))} com ${stName(x.c.studentId)}</li>`)}${list.length > 8 ? html`<li>e mais ${list.length - 8}…</li>` : ''}</ul><p class="muted small" style="margin:0">Você pode agendar mesmo assim, se for intencional.</p>`;
FORMS.lesson = async (v, form, ds) => {
  const old = ds.id ? M.lessons.get(ds.id) : null;
  if (!v.studentId) { toast('Escolha o aluno da aula.', 'err'); return; }
  if (!v.date || !v.time) { toast('Informe data e horário.', 'err'); return; }
  const base = {
    ...(old || {}), studentId: v.studentId, date: v.date, time: v.time, duration: clamp(num(v.duration, 60), 5, 480), type: v.type, status: v.status,
    topic: v.topic.trim(), objectives: v.objectives, content: v.content, skills: v.skills || [], materials: v.materials || [], exercises: v.exercises || [],
    homeworkText: v.homeworkText, observations: v.observations, makeupFor: v.type === 'reposicao' ? (v.makeupFor || '') : '',
    notes: Object.fromEntries(NOTE_FIELDS.map(([k]) => [k, v['n_' + k] || '']))
  };
  const weeks = old ? 1 : clamp(parseInt(v.repeat, 10) || 1, 1, 26);
  const dates = Array.from({ length: weeks }, (_, i) => addDays(v.date, 7 * i));
  if (base.status === 'realizada' && v.date > todayISO()) {
    if (!await confirmBox({ title: 'Aula no futuro', message: `A data (${fmtDate(v.date)}) ainda não chegou. Marcar como realizada mesmo assim?`, ok: 'Marcar como realizada' })) return;
  }
  if (SLOT_STATUS.has(base.status)) {
    const conflicts = [];
    dates.forEach(d => findConflicts(S.lessons, { ...base, id: old ? old.id : undefined, date: d }).forEach(c => conflicts.push({ d, c })));
    if (conflicts.length && !await confirmBox({ title: 'Conflito de horário', message: conflictMessage(conflicts), ok: 'Agendar mesmo assim' })) return;
  }
  const wasDone = old && old.status === 'realizada';
  for (let i = 0; i < dates.length; i++) await put('lessons', i === 0 ? { ...base, date: dates[0] } : { ...base, id: undefined, date: dates[i] });
  closeModal();
  toast(old ? 'Aula atualizada.' + (base.status === 'realizada' && !wasDone ? pkgNote(base.studentId, base.date) : '') : weeks > 1 ? `${weeks} aulas agendadas.` : base.status === 'realizada' ? 'Aula registrada no histórico do aluno.' + pkgNote(base.studentId, base.date) : 'Aula agendada.', 'ok');
};

      ${exs.length ? html`<div><div class="tiny muted" style="font-weight:700;letter-spacing:.05em;text-transform:uppercase">Exercícios realizados</div><div class="row">${exs.map(e => badge(e.title))}</div></div>` : ''}

      ${l.status === 'agendada' ? html`<p class="hint">Aulas agendadas não descontam do pacote. Registre a aula como realizada para contabilizar presença e pacote.</p>` : ''}

      ${canFinish ? btn('Registrar aula realizada', 'lesson-finish', { cls: 'primary', data: { id }, icon: 'check' }) : (hasLessonNotes(l) || l.status === 'realizada' ? btn('Editar lesson notes', 'lesson-finish', { data: { id } }) : '')}`
  });
}

/* =================== CALENDÁRIO =================== */
const HOUR_PX = 56;
const weekColOf = d => (d.getDay() - (S.settings.weekStart === 0 ? 0 : 1) + 7) % 7;
const startOfWeek = iso => addDays(iso, -weekColOf(parseD(iso)));
const WEEK_LABELS = () => S.settings.weekStart === 0 ? ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'] : ['Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb', 'Dom'];
ACTIONS['cal-view'] = d => { UI.cal.view = d.view; render(); };
ACTIONS['cal-nav'] = d => {
  const c = UI.cal, dir = +d.dir;
  if (!dir) c.date = todayISO();
  else if (c.view === 'month') c.date = addMonths(monthOf(c.date), dir) + '-01';
  else c.date = addDays(c.date, dir * (c.view === 'week' ? 7 : 1));
  render();
};
ACTIONS['cal-day'] = d => { UI.cal.view = 'day'; UI.cal.date = d.date; render(); };
ACTIONS.slot = (d, t, e) => {
  const y = e.clientY - t.getBoundingClientRect().top, start = +d.start;
  const min = clamp(start + Math.round(y / HOUR_PX * 2) * 30, 0, 23 * 60 + 30);
  openLessonForm(null, { date: d.date, time: minToTime(min) });
};
ACTIONS['cal-new'] = d => openLessonForm(null, { date: d.date });

function monthView(byDate, today) {
  const ym = monthOf(UI.cal.date), first = ym + '-01', gridStart = startOfWeek(first);
  const weeksN = Math.ceil((weekColOf(parseD(first)) + daysInMonth(ym)) / 7);
  const cells = Array.from({ length: weeksN * 7 }, (_, i) => addDays(gridStart, i));
  return html`<div class="mgrid" role="grid">${WEEK_LABELS().map(w => html`<div class="mh">${w}</div>`)}
    ${cells.map(d => { const ls = (byDate[d] || []).sort((a, b) => cmpStr(a.time, b.time)); return html`<div class="mc ${monthOf(d) !== ym ? 'out' : ''} ${d === today ? 'today' : ''}" data-act="cal-day" data-date="${d}"><span class="dn">${+d.slice(8)}</span>
      ${ls.slice(0, 3).map(l => html`<button type="button" class="ev s-${l.status}" data-act="lesson" data-id="${l.id}" title="${stName(l.studentId)} · ${l.topic || ''}">${l.time} ${(stName(l.studentId).split(' ')[0])}</button>`)}${ls.length > 3 ? html`<span class="more">+${ls.length - 3} mais</span>` : ''}</div>`; })}</div>`;
}
function gridView(days, byDate, today) {
  const all = days.flatMap(d => byDate[d] || []);
  let start = 7 * 60, end = 21 * 60;
  for (const l of all) { start = Math.min(start, Math.floor(timeToMin(l.time) / 60) * 60); end = Math.max(end, Math.ceil((timeToMin(l.time) + (Number(l.duration) || 60)) / 60) * 60); }
  const H = (end - start) / 60 * HOUR_PX, hours = Array.from({ length: (end - start) / 60 + 1 }, (_, i) => start / 60 + i);
  return html`<div class="tgwrap"><div class="tg" style="--cols:${days.length};--H:${H}px;--HH:${HOUR_PX}px">
    <div class="tg-h"></div>${days.map(d => html`<button type="button" class="tg-h ${d === today ? 'today' : ''}" style="border-top:0;border-right:0;cursor:pointer;font:inherit" data-act="cal-day" data-date="${d}">${WEEK_LABELS()[weekColOf(parseD(d))]} ${d.slice(8)}/${d.slice(5, 7)}</button>`)}
    <div class="tg-time">${hours.slice(0, -1).map((h, i) => html`<span style="top:${i * HOUR_PX}px">${pad(h)}:00</span>`)}</div>
    ${days.map(d => html`<div class="tg-col ${d === today ? 'today' : ''}" data-act="slot" data-date="${d}" data-start="${start}" aria-label="Agenda de ${fmtDate(d)}">${layoutDay(byDate[d] || []).map(({ l, lane, lanes }) => {

const HAS_OPTIONS = t => t === 'multipla_escolha' || t === 'associacao';
const Q_HINT = {

  interpretacao: 'Pergunta sobre o texto acima. Resposta esperada.',
  listening: 'Pergunta sobre o áudio. Resposta esperada.',
  speaking: 'Tópico ou pergunta a ser falada. Pontos esperados.'

function qBlock(q, type) {
  q = q || {};
  return html`<div class="qblock"><div class="row"><b class="small q-n">Questão</b><span class="spacer"></span><button type="button" class="icon-btn danger" data-act="q-del" title="Remover questão" aria-label="Remover questão">${ico('trash')}</button></div>

    <div class="g2">${fld('Resposta correta / modelo', input('q_answer[]', q.answer))}${fld('Explicação (opcional)', input('q_expl[]', q.explanation))}</div></div>`;
}
function renumberQ(root) { root.querySelectorAll('.qblock .q-n').forEach((el, i) => { el.textContent = 'Questão ' + (i + 1); }); }
ACTIONS['q-add'] = (d, t) => {
  const form = t.closest('form'), box = form.querySelector('#qlist');
  box.insertAdjacentHTML('beforeend', String(qBlock({}, form.elements.type.value))); renumberQ(box);
  const ta = box.querySelectorAll('.qblock textarea[name="q_prompt[]"]'); ta[ta.length - 1].focus();
};
ACTIONS['q-del'] = (d, t) => { const box = t.closest('#qlist'); t.closest('.qblock').remove(); renumberQ(box); };
CHANGES['ex-type'] = (v, t) => {
  const form = t.closest('form'), box = form.querySelector('#qlist'), data = collectQuestions(form);
  box.innerHTML = String(raw(data.map(q => String(qBlock(q, v))).join(''))); renumberQ(box);
  form.querySelector('#qhint').textContent = Q_HINT[v] || '';
  form.querySelector('#textfld').hidden = !['interpretacao'].includes(v);
};
function collectQuestions(form) {
  const v = formData(form), arr = x => [].concat(v[x] || []);
  const P = arr('q_prompt'), O = arr('q_options'), A = arr('q_answer'), E = arr('q_expl');
  // q_prompt[] vem como 'q_prompt' após formData; textareas ocultas ficam alinhadas por índice
  return P.map((p, i) => ({ prompt: p, options: String(O[i] || '').split('\n').map(s => s.trim()).filter(Boolean), answer: A[i] || '', explanation: E[i] || '' }));
}

FORMS.homework = async (v, form, ds) => {
  const old = ds.id ? M.homework.get(ds.id) : null;
  const title = v.title.trim(); if (!title) { toast('Informe o título.', 'err'); return; }
  const ed = form.querySelector('#hw_doc'), docHtml = ed ? cleanDoc(ed.innerHTML, 20000) : '';
  if (docEmpty(docHtml) && ed && ed.innerHTML.length > 20000) { toast('O documento ficou grande demais.', 'err'); return; }
  if (v.attachUrl.trim() && !isHttpUrl(v.attachUrl.trim())) { toast('O link do documento precisa começar com https://', 'err'); return; }
  let attachId = old ? old.attachId || '' : '', attachName = old ? old.attachName || '' : '';
  const hf = form.elements.hfile && form.elements.hfile.files[0];
  if (hf) { try { attachId = await uploadFile(hf); attachName = hf.name; } catch (e) { toast('Não foi possível enviar o anexo: ' + errMsg(e), 'err'); return; } }
  const base = { title, exerciseId: v.exerciseId, description: v.description, assignedDate: v.assignedDate, dueDate: v.dueDate, estMinutes: v.estMinutes, status: v.status, docHtml: docEmpty(docHtml) ? '' : docHtml, attachId, attachName, attachUrl: v.attachUrl.trim() };
  if (v.dueDate && v.dueDate < v.assignedDate) { toast('O prazo não pode ser antes da atribuição.', 'err'); return; }
  if (old) {
    const patch = { ...old, ...base };
    if (isDelivered(patch) && !patch.deliveredDate) patch.deliveredDate = todayISO();
    await put('homework', patch); closeModal(); toast('Homework atualizado.', 'ok'); return;
  }
  const ids = v.studentIds || [];
  if (!ids.length) { toast('Marque pelo menos um aluno.', 'err'); return; }
  for (const sid of ids) await put('homework', { ...base, studentId: sid, maxScore: 10, createdAt: nowKey() });
  closeModal(); toast(ids.length > 1 ? `Homework atribuído a ${ids.length} alunos.` : 'Homework atribuído.', 'ok');
};

FORMS.plan = async (v, f, ds) => {
  const old = ds.id ? M.plans.get(ds.id) : null;
  const many = !old && Array.isArray(v.studentIds) ? v.studentIds : null;
  if ((!many && !v.studentId) || !v.weekStart) { toast('Informe aluno e semana.', 'err'); return; }
  if (many && !many.length) { toast('Marque pelo menos um aluno da turma.', 'err'); return; }
  const dup = many ? null : S.plans.find(p => p.studentId === v.studentId && p.weekStart === v.weekStart && (!old || p.id !== old.id));
  if (dup && !await confirmBox({ title: 'Já existe um plano nesta semana', message: 'Este aluno já tem um plano começando nesta data. Criar outro mesmo assim?', ok: 'Criar mesmo assim' })) return;
  const url = (v.pdfUrl || '').trim(); if (url && !isHttpUrl(url)) { toast('O link precisa começar com https://', 'err'); return; }
  const file = f.elements.pfile && f.elements.pfile.files[0]; let pdfAssetId = old ? old.pdfAssetId || '' : '', pdfName = old ? old.pdfName || '' : '';
  if (file) { try { const nid = await uploadFile(file); await releaseAsset(pdfAssetId); pdfAssetId = nid; pdfName = file.name; } catch (e) { toast('Não foi possível enviar o PDF: ' + errMsg(e), 'err'); return; } }
  if (!old && !pdfAssetId && !url) { toast('Anexe o PDF do plano (ou cole um link).', 'err'); return; }
  if (many) { for (const sid of many) await put('plans', { days: {}, studentId: sid, weekStart: v.weekStart, weekEnd: addDays(v.weekStart, 6), pdfAssetId, pdfName, pdfUrl: url }); closeModal(); toast('Plano enviado para ' + many.length + ' aluno(s) da turma.', 'ok'); return; }
  const data = { ...(old || { days: {} }), studentId: v.studentId, weekStart: v.weekStart, weekEnd: addDays(v.weekStart, 6), pdfAssetId, pdfName, pdfUrl: url };
  await put('plans', data); closeModal(); toast(old ? 'Plano atualizado.' : 'Plano salvo.' + ((M.students.get(v.studentId) || {}).accountId ? ' O aluno já pode abrir o PDF.' : ' Vincule a conta do aluno para ele ver.'), 'ok');
};

const SK_COLOR = { grammar: '#6C8CF0', vocabulary: '#E8A25C', reading: '#5FB38C', writing: '#C77DB8', listening: '#4FB3C8', speaking: '#E27D7D', pronunciation: '#8C8CD0' };
const skColorVar = k => `var(--h-${k})`;
const REP_TEXT = [['strengths', 'Pontos fortes'], ['improve', 'Pontos a melhorar'], ['nextSteps', 'Próximos passos'], ['teacherNotes', 'Observações da professora']];

function reportsOf(studentId) { return S.reports.filter(r => r.studentId === studentId).sort((a, b) => cmpStr(a.periodEnd || a.date, b.periodEnd || b.date)); }
function prevReport(r) { return reportsOf(r.studentId).filter(x => x.id !== r.id && (x.periodEnd || x.date) < (r.periodEnd || r.date)).pop(); }
const scoreOf = (r, k) => { const s = r && r.scores && r.scores[k]; return s && typeof s.score === 'number' ? s.score : null; };

function evolutionChart(studentId) {
  const rs = reportsOf(studentId);
  if (rs.length < 2) return html`<p class="muted small" style="margin:0">São necessários pelo menos 2 relatórios para mostrar a evolução.</p>`;
  const series = SKILLS.map(([k, l]) => ({ name: l, color: skColorVar(k), values: rs.map(r => scoreOf(r, k)) })).filter(s => s.values.some(v => v != null));
  return lineChart({ labels: rs.map(r => fmtDateShort(r.periodEnd || r.date)), series, max: 10, aria: 'Evolução das notas por habilidade' });
}
function reportsTable(list, showStudent) {
  return html`<div class="tablewrap"><table class="tbl"><thead><tr><th>Período</th>${showStudent ? html`<th>Aluno</th>` : ''}<th class="num">Média</th><th>Habilidades avaliadas</th><th>Emitido em</th><th></th></tr></thead><tbody>
  ${list.map(r => { const avg = skillAvg(r); return html`<tr data-act="open-report" data-id="${r.id}">
    <td class="nowrap"><b>${fmtDate(r.periodStart)}</b> a ${fmtDate(r.periodEnd)} ${demoTag(r)}</td>${showStudent ? html`<td><div class="who">${avatar(M.students.get(r.studentId), 28)}<span>${stName(r.studentId)}</span></div></td>` : ''}
    <td class="num"><b>${avg == null ? '—' : String(avg).replace('.', ',')}</b></td><td>${SKILLS.filter(([k]) => scoreOf(r, k) != null).map(([k]) => skillTag(k))}</td><td class="nowrap">${fmtDate(String(r.date).slice(0, 10))}</td>
    <td class="acts"><button type="button" class="btn sm" data-act="rep-pdf" data-id="${r.id}">${ico('download')}PDF</button></td></tr>`; })}</tbody></table></div>`;
}

function openReportForm(id, opts) {
  opts = opts || {};
  const old = id ? M.reports.get(id) : null, today = todayISO();
  const sid = old ? old.studentId : opts.studentId || '';
  const last = sid ? reportsOf(sid).pop() : null;
  const r = old || { studentId: sid, periodStart: last ? addDays(last.periodEnd, 1) : addDays(today, -60), periodEnd: today, scores: {} };
  openModal({
    title: old ? 'Editar relatório' : 'Novo relatório de desempenho', wide: true, form: { name: 'report', id: id || '' }, body: html`
    <div class="g3">${fld('Aluno *', select('studentId', studentOptions({ keep: r.studentId, blank: 'Escolha o aluno…' }), r.studentId, { a: { required: true } }))}${fld('Início do período *', input('periodStart', r.periodStart, { type: 'date', a: { required: true } }))}${fld('Fim do período *', input('periodEnd', r.periodEnd, { type: 'date', a: { required: true } }))}</div>
    <div class="stack-s"><b>Avaliação por habilidade <span class="muted small">(nota de 1 a 10; deixe vazio se não avaliou)</span></b>

    ${REP_TEXT.map(([k, l]) => fld(l, textarea(k, r[k], { rows: 2 })))}
    <label class="chk"><input type="checkbox" name="shared" value="1"${r.shared ? raw(' checked') : ''}> Mostrar na área do aluno (notas, pontos fortes e o que melhorar; suas notas internas ficam só com você)</label>
    <p class="hint">Frequência, aulas realizadas e homework do período são calculados automaticamente a partir dos seus registros e gravados no relatório.</p>`
  });
}
FORMS.report = async (v, f, ds) => {
  const old = ds.id ? M.reports.get(ds.id) : null;
  if (!v.studentId) { toast('Escolha o aluno.', 'err'); return; }
  if (v.periodEnd < v.periodStart) { toast('O fim do período não pode ser antes do início.', 'err'); return; }
  const scores = {}; let any = false;
  for (const [k] of SKILLS) {
    const raw_ = String(v['score_' + k] || '').trim();
    if (raw_ === '') { if ((v['comment_' + k] || '').trim()) scores[k] = { score: null, comment: v['comment_' + k] }; continue; }
    const n = num(raw_, NaN);
    if (!(n >= 1 && n <= 10)) { toast(`A nota de ${labelOf(SKILLS, k)} deve estar entre 1 e 10.`, 'err'); return; }
    scores[k] = { score: n, comment: v['comment_' + k] || '' }; any = true;
  }
  if (!any) { toast('Dê nota a pelo menos uma habilidade.', 'err'); return; }
  const same = old && old.studentId === v.studentId && old.periodStart === v.periodStart && old.periodEnd === v.periodEnd;
  const snapshot = same && old.snapshot ? old.snapshot : reportSnapshot(v.studentId, v.periodStart, v.periodEnd, D());
  const id = await put('reports', { ...(old || { date: nowKey() }), studentId: v.studentId, periodStart: v.periodStart, periodEnd: v.periodEnd, scores, strengths: v.strengths, improve: v.improve, nextSteps: v.nextSteps, teacherNotes: v.teacherNotes, shared: v.shared === '1', snapshot });
  closeModal(); toast(old ? 'Relatório atualizado.' : 'Relatório salvo no histórico do aluno.', 'ok');
  if (!old) openReportView(id);
};
const fmtAvg = n => n == null ? '—' : String(n).replace('.', ',');

  <h3>Avaliação por habilidade</h3>
  ${evaluated.map(([k, l]) => { const sc = scoreOf(r, k), c = (r.scores[k] || {}).comment, pv = scoreOf(prev, k); return html`<div class="skrow"><span>${skillTag(k)}</span>${bar(sc * 10)}<b>${String(sc).replace('.', ',')}</b></div>${c || pv != null ? html`<div class="skc">${c || ''}${pv != null ? html` <em>(anterior: ${String(pv).replace('.', ',')}${sc > pv ? ' ▲' : sc < pv ? ' ▼' : ' ='})</em>` : ''}</div>` : ''}`; })}
  ${prev && evaluated.length ? html`<h3>Anterior × atual</h3>${barChart({ labels: evaluated.map(([, l]) => l.slice(0, 5)), series: [{ name: 'Anterior (' + fmtDateShort(prev.periodEnd) + ')', color: 'var(--c2)', values: evaluated.map(([k]) => scoreOf(prev, k)) }, { name: 'Atual', color: 'var(--c1)', values: evaluated.map(([k]) => scoreOf(r, k)) }], max: 10, aria: 'Comparação com o relatório anterior' })}` : ''}

const pdfSafe = s => String(s == null ? '' : s).replace(/[–—]/g, '-').replace(/[“”]/g, '"').replace(/[‘’]/g, "'").replace(/…/g, '...').replace(/[·•]/g, '-').replace(/[▲▼]/g, '').replace(/[^\x09\x0A\x0D\x20-\x7E -ÿ]/g, '?');
const hexRGB = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
function buildReportPDF(r) {
  const J = window.jspdf && window.jspdf.jsPDF; if (!J) return null;
  const doc = new J({ unit: 'pt', format: 'a4' }), W = 595, M_ = 48, CW = W - 2 * M_, s = M.students.get(r.studentId), sn = r.snapshot || {}, prev = prevReport(r);
  doc.setFillColor(180, 92, 100); doc.rect(0, 0, W, 26, 'F'); doc.setFillColor(196, 192, 214); doc.rect(0, 26, W, 5, 'F');
  try { doc.addImage(LOGO, 'PNG', W - M_ - 40, 34, 40, 40); } catch (e) { /* logo é opcional */ }
  let y = M_ + 18;
  const need = h => { if (y + h > 800) { doc.addPage(); y = M_; } };
  const text = (t, size, bold, color, x) => {
    doc.setFont('helvetica', bold ? 'bold' : 'normal'); doc.setFontSize(size); doc.setTextColor(...(color || [30, 30, 40]));
    const lines = doc.splitTextToSize(pdfSafe(t), CW - ((x || M_) - M_));
    for (const ln of lines) { need(size * 1.35); doc.text(ln, x || M_, y + size); y += size * 1.35; }
  };
  const head = t => { y += 10; need(30); doc.setDrawColor(213, 164, 168); doc.line(M_, y, W - M_, y); y += 4; text(t.toUpperCase(), 9, true, [42, 80, 109]); y += 2; };
  text(s ? s.name : 'Aluno', 22, true); text('Relatório de desempenho · ' + fmtDate(r.periodStart) + ' a ' + fmtDate(r.periodEnd) + (s ? ' · Nível ' + s.level : ''), 10, false, [100, 100, 115]);
  text((S.settings.businessName || S.settings.platformName || '') + (S.settings.teacherName ? ' - ' + S.settings.teacherName : ''), 9, false, [130, 130, 145]);
  const avg = skillAvg(r); text('Média geral: ' + (avg == null ? '-' : String(avg).replace('.', ',')) + ' / 10', 13, true, [159, 81, 83]);
  head('Frequência e atividades');
  text(`Aulas realizadas: ${sn.lessonsDone ?? 0}   Faltas: ${sn.absences ?? 0}   Canceladas: ${sn.canceled ?? 0}   Frequência: ${sn.attendancePct == null ? '-' : sn.attendancePct + '%'}`, 10);
  text(`Homework entregue: ${sn.hwDelivered ?? 0}/${sn.hwAssigned ?? 0}   Média do homework: ${sn.hwAvgPct == null ? '-' : sn.hwAvgPct + '%'}`, 10);
  head('Avaliação por habilidade');
  for (const [k, l] of SKILLS) {
    const sc = scoreOf(r, k); if (sc == null) continue; const c = (r.scores[k] || {}).comment, pv = scoreOf(prev, k);
    need(34); const top = y;
    text(l, 10, true, hexRGB(SK_COLOR[k]).map(v => Math.round(v * .7)));
    doc.setFillColor(235, 235, 242); doc.roundedRect(M_ + 110, top + 2, 300, 8, 4, 4, 'F'); doc.setFillColor(...hexRGB(SK_COLOR[k])); doc.roundedRect(M_ + 110, top + 2, Math.max(6, 300 * sc / 10), 8, 4, 4, 'F');
    doc.setFont('helvetica', 'bold'); doc.setFontSize(10); doc.setTextColor(30, 30, 40); doc.text(String(sc).replace('.', ',') + (pv != null ? `  (anterior ${String(pv).replace('.', ',')})` : ''), M_ + 420, top + 10);
    if (c) text(c, 9, false, [90, 90, 105], M_ + 110);
    y += 3;
  }
  for (const [k, l] of REP_TEXT) if (r[k]) { head(l); text(r[k], 10); }
  if ((sn.goals || []).length) { head('Objetivos de aprendizagem'); sn.goals.forEach(g => text(`${g.name} - ${g.progress}%`, 10)); }
  const n = doc.getNumberOfPages(); for (let i = 1; i <= n; i++) { doc.setPage(i); doc.setFontSize(8); doc.setTextColor(150, 150, 160); doc.text(pdfSafe(`Gerado em ${fmtDate(todayISO())} - página ${i}/${n}`), M_, 820); }
  return doc;
}

/* =================== MODELOS NA BIBLIOTECA =================== */
const MODEL_DOCS = []; // modelos de PDF não acompanham este site; a Biblioteca começa vazia
async function seedModels() {
  if (window.__NOSEED || S.seeding || S.settings.modelsSeeded || !MODEL_DOCS.length || S.mode !== 'professora') return;
  S.seeding = true;
  try {
    for (const m of MODEL_DOCS) if (!S.materials.some(x => x.assetId === m.assetId)) await put('materials', { title: m.title, category: 'modelo', skill: '', level: '', description: m.desc, link: '', tags: ['modelo', 'minha identidade'], studentIds: [], assetId: m.assetId, fileName: m.fileName, showStudent: false, createdAt: nowKey() });
    await saveSettings({ modelsSeeded: true }); toast('Seus modelos de documentos foram adicionados à Biblioteca (categoria "Modelos").', 'ok');
  } catch (e) { console.error(e); } finally { S.seeding = false; }
}

FORMS.recording = async (v, f, ds) => {
  const old = ds.id ? M.recordings.get(ds.id) : null;
  const many = !old && Array.isArray(v.studentIds) ? v.studentIds : null;
  if (!many && !v.studentId) { toast('Escolha o aluno.', 'err'); return; }
  if (many && !many.length) { toast('Marque pelo menos um aluno da turma.', 'err'); return; }
  const url = v.url.trim(); if (url && !isHttpUrl(url)) { toast('O link precisa começar com https://', 'err'); return; }
  let assetId = old ? old.assetId || '' : '', fileName = old ? old.fileName || '' : '';
  const file = f.elements.rfile && f.elements.rfile.files[0];
  if (file) { try { assetId = await uploadFile(file); fileName = file.name; } catch (e) { toast('Não foi possível enviar o arquivo: ' + errMsg(e), 'err'); return; } }
  if (!url && !assetId) { toast('Cole o link da gravação ou envie um arquivo.', 'err'); return; }
  if (many) { for (const sid of many) await put('recordings', { studentId: sid, lessonId: '', title: v.title.trim(), date: v.date, url, assetId, fileName, note: v.note, shared: v.shared === '1', createdAt: nowKey() }); closeAllModals(); toast('Gravação enviada para ' + many.length + ' aluno(s) da turma.', 'ok'); return; }
  await put('recordings', { ...(old || { createdAt: nowKey() }), studentId: v.studentId, lessonId: ds.lesson || (old && old.lessonId) || '', title: v.title.trim(), date: v.date, url, assetId, fileName, note: v.note, shared: v.shared === '1' });
  closeAllModals(); toast('Gravação salva.' + (v.shared === '1' && (M.students.get(v.studentId) || {}).accountId ? ' O aluno já pode assistir.' : ''), 'ok');
};

const NTF = { sid: '', kind: 'painel', hid: '' };

  const n = S.students.filter(s => s.demo).length + COLS.reduce((a, c) => a + S[c].filter(x => x.demo).length, 0);
  if (!n) { toast('Não há dados de demonstração para remover.', 'ok'); return; }
  if (!await confirmBox({ title: 'Remover dados de demonstração?', message: 'Apenas registros marcados DEMO (e o que for ligado aos alunos fictícios) serão apagados. Seus dados reais continuam.', danger: true, ok: 'Remover demonstração' })) return;
  try { await removeDemo(); toast('Dados de demonstração removidos.', 'ok'); } catch (e) { toast('A remoção falhou: ' + errMsg(e), 'err'); }
};

;
/* ============================================================
   api.js — comunicação com a API (Node.js + PostgreSQL)
   Oferece ao restante do site a mesma interface de dados que ele usa
   (user, db, downloads, assets), mas falando com a API por HTTPS.
   O endereço da API vem de config.js (window.APP_CONFIG.apiUrl).
   ============================================================ */
const API = (() => {
  const cfg = window.APP_CONFIG || {};
  const base = String(cfg.apiUrl || '').trim().replace(/\/+$/, '');
  const TK = 'eth_token', POLL_MS = Math.max(5000, Number(cfg.pollSeconds || 20) * 1000);
  let token = null, me = null;
  try { token = localStorage.getItem(TK) || null; } catch (e) { token = null; }
  const clone = o => JSON.parse(JSON.stringify(o));
  const mkErr = (msg, code, status) => { const e = new Error(msg); e.code = code; e.status = status; return e; };
  const AVATAR = 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32"><circle cx="16" cy="16" r="16" fill="#c9c4d4"/></svg>');

  function setToken(t) { token = t; try { if (t) localStorage.setItem(TK, t); else localStorage.removeItem(TK); } catch (e) { /* sem armazenamento: vale só nesta aba */ } }
  function expired() {
    setToken(null);
    try { sessionStorage.setItem('eth_msg', 'Sua sessão terminou. Entre novamente.'); } catch (e) { /* ignora */ }
    location.reload();
  }
  async function call(method, path, body, opt) {
    if (!base) throw mkErr('A API ainda não foi configurada neste site.', 'unavailable', 0);
    const h = {}; if (token && !(opt && opt.anon)) h.Authorization = 'Bearer ' + token;
    let payload;
    if (typeof Blob !== 'undefined' && body instanceof Blob) { payload = body; h['Content-Type'] = body.type || 'application/octet-stream'; }
    else if (body !== undefined) { payload = JSON.stringify(body); h['Content-Type'] = 'application/json'; }
    let r;
    try { r = await fetch(base + path, { method, headers: h, body: payload }); } catch (e) { throw mkErr('Sem conexão com o servidor. Verifique a internet e tente de novo.', 'unavailable', 0); }
    let data = null; try { data = await r.json(); } catch (e) { data = null; }
    if (!r.ok) {
      if (r.status === 401 && token && !(opt && opt.anon)) { expired(); throw mkErr('Sua sessão terminou.', 'revoked', 401); }
      throw mkErr((data && data.error) || ('Erro ' + r.status + ' no servidor.'), r.status >= 500 ? 'unavailable' : 'api', r.status);
    }
    return data;
  }

  /* ---------- sessão ---------- */
  const configured = () => !!base;
  const hasToken = () => !!token;
  async function login(email, password) {
    const r = await call('POST', '/auth/login', { email, password }, { anon: true });
    setToken(r.token); me = r.user; return me;
  }
  async function loadMe() { const r = await call('GET', '/auth/me'); me = r.user; return me; }
  function logout() { setToken(null); me = null; location.reload(); }
  const fileUrl = id => base + '/files/' + encodeURIComponent(id) + '?token=' + encodeURIComponent(token || '');

  /* ---------- cache e sincronização por consulta periódica ---------- */
  const cache = { sync: null, bundle: null };
  const watchers = new Set();
  let epoch = 0, writing = 0, timer = 0, polling = false;

  const snapOf = (docs, exists) => ({ exists, docs, metadata: { fromCache: false, hasPendingWrites: false } });
  const docSnap = (id, d) => ({ exists: d != null, id, data: () => (d == null ? undefined : clone(d)), metadata: { fromCache: false, hasPendingWrites: false } });
  const stripId = r => { const o = { ...r }; delete o.id; return o; };

  /* converte um caminho "estilo documento" no que está em cache */
  function readDoc(path) {
    const p = path.split('/');
    if (p[0] === 'data' && p[1] === 'users' && p.length === 4 && p[3] === 'hub') {
      const s = cache.sync && cache.sync.settings;
      return docSnap('hub', s && s.exists ? { settings: s.settings, updatedAt: 0 } : null);
    }
    if (p[0] === 'portal' && p.length === 2) return docSnap(p[1], cache.bundle ? cache.bundle.portal : null);
    if (p[0] === 'hwsub' && p.length === 2) return docSnap(p[1], cache.bundle ? cache.bundle.submissions : null);
    if (p[0] === 'hwret' && p.length === 2) return docSnap(p[1], cache.bundle ? cache.bundle.returns : null);
    return docSnap(p[p.length - 1], null);
  }
  function readCol(path) {
    const p = path.split('/');
    if (p[0] === 'data' && p[1] === 'users' && p.length === 5 && p[3] === 'hub') {
      const list = (cache.sync && cache.sync.collections && cache.sync.collections[p[4]]) || [];
      return snapOf(list.map(r => ({ id: r.id, data: () => clone(stripId(r)) })), true);
    }
    if (p[0] === 'hwsub' && p.length === 1) {
      const subs = (cache.sync && cache.sync.submissions) || {};
      return snapOf(Object.keys(subs).map(id => ({ id, data: () => clone(subs[id]) })), true);
    }
    return snapOf([], true);
  }
  const sig = s => JSON.stringify(s.docs ? s.docs.map(d => [d.id, d.data()]) : [s.exists, s.data && s.data()]);

  function deliver() {
    for (const w of [...watchers]) {
      if (!w.ready()) continue;
      const s = w.read(), k = sig(s);
      if (k !== w.last) { w.last = k; try { w.cb(s); } catch (e) { console.error(e); } }
    }
  }
  const needs = () => (me && me.role === 'professora') ? 'sync' : 'bundle';
  async function refresh() {
    if (polling || !me) return; polling = true;
    const ep = epoch, kind = needs();
    try {
      const d = kind === 'sync' ? await call('GET', '/sync') : await call('GET', '/me/bundle');
      if (ep === epoch && writing === 0) { cache[kind] = d; }
      else if (!cache[kind]) cache[kind] = d;
      for (const w of watchers) if (w.failed) { w.failed = false; w.last = null; }
      deliver();
    } catch (e) {
      for (const w of [...watchers]) if (w.onErr) { w.failed = true; try { w.onErr(e); } catch (x) { console.error(x); } }
    } finally { polling = false; }
  }
  function startPolling() {
    if (timer) return;
    timer = setInterval(() => { if (!document.hidden) refresh(); }, POLL_MS);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
    window.addEventListener('online', refresh);
  }
  function watch(readFn, readyFn, cb, onErr) {
    const w = { read: readFn, ready: readyFn, cb, onErr, last: null };
    watchers.add(w); startPolling();
    if (readyFn()) setTimeout(deliver, 0); else setTimeout(refresh, 0);
    return () => watchers.delete(w);
  }
  const ready = () => !!cache[needs()];
  async function write(fn) {
    writing++; epoch++;
    try { return await fn(); } finally { writing--; epoch++; }
  }

  /* ---------- "banco de dados" ---------- */
  function docRef(path) {
    const p = path.split('/'), id = p[p.length - 1];
    return {
      path, id,
      collection: n => colRef(path + '/' + n),
      async get() {
        if (p[0] === 'hwret' && me && me.role === 'professora') { const r = await call('GET', '/returns/' + encodeURIComponent(id)); return docSnap(id, r.doc || null); }
        if (!ready()) await refresh();
        return readDoc(path);
      },
      async set(d) {
        await write(async () => {
          if (p[0] === 'data' && p.length === 4) {
            await call('PUT', '/settings', d.settings || {});
            if (cache.sync) cache.sync.settings = { exists: true, settings: clone(d.settings || {}) };
          } else if (p[0] === 'data' && p.length === 6) {
            await call('PUT', '/' + p[4] + '/' + encodeURIComponent(id), d);
            const list = (cache.sync && cache.sync.collections && cache.sync.collections[p[4]]);
            if (list) { const row = { id, ...clone(d) }, i = list.findIndex(x => x.id === id); if (i >= 0) list[i] = row; else list.push(row); }
          } else if (p[0] === 'portal') {
            await call('PUT', '/portal/' + encodeURIComponent(id), d);
          } else if (p[0] === 'hwsub') {
            await call('PUT', '/me/submissions', { items: d.items || {} });
            if (cache.bundle) cache.bundle.submissions = clone(d);
          } else if (p[0] === 'hwret') {
            await call('PUT', '/returns/' + encodeURIComponent(id), { items: d.items || {} });
          } else throw mkErr('Caminho de dados desconhecido: ' + path, 'api', 0);
        });
        deliver();
      },
      async delete() {
        await write(async () => {
          if (p[0] === 'data' && p.length === 6) {
            await call('DELETE', '/' + p[4] + '/' + encodeURIComponent(id));
            const c = cache.sync && cache.sync.collections; if (c && c[p[4]]) c[p[4]] = c[p[4]].filter(x => x.id !== id);
          } else if (p[0] === 'portal') {
            await call('DELETE', '/portal/' + encodeURIComponent(id));
          } else throw mkErr('Não é possível excluir este item.', 'api', 0);
        });
        deliver();
      },
      onSnapshot(cb, onErr) { return watch(() => readDoc(path), ready, cb, onErr); }
    };
  }
  function colRef(path) {
    return {
      path, doc: id => docRef(path + '/' + id),
      onSnapshot(cb, onErr) { return watch(() => readCol(path), ready, cb, onErr); }
    };
  }

  /* ---------- contas ---------- */
  const user = {
    id: async () => me && me.id,
    me: async () => ({ name: (me && (me.name || me.email)) || '' }),
    isOwner: async () => !!me && me.role === 'professora',
    role: () => (me && me.role) || '',
    search: async (q, role) => {
      const r = await call('GET', '/users/search?q=' + encodeURIComponent(q || ''));
      return r.users.filter(u => !role || u.role === role).map(u => ({ id: u.id, name: u.name ? u.name + ' (' + u.email + ')' : u.email, email: u.email, role: u.role, avatarUrl: AVATAR }));
    },
    profiles: async ids => (await call('POST', '/users/profiles', { ids })).profiles,
    create: async o => (await call('POST', '/users', o)).user,
    resetPassword: async (id, password) => { await call('POST', '/users/' + encodeURIComponent(id) + '/password', { password }); },
    changePassword: async (current, password) => { await call('POST', '/auth/password', { current, password }); }
  };

  /* ---------- arquivos e downloads ---------- */
  const assets = {
    upload: async file => {
      const r = await call('POST', '/files?name=' + encodeURIComponent(file.name || 'arquivo'), file);
      return { id: r.id, url: fileUrl(r.id), sizeBytes: r.sizeBytes, contentType: r.contentType };
    },
    delete: async id => { try { await call('DELETE', '/files/' + encodeURIComponent(id)); } catch (e) { if (e.status !== 404 && e.status !== 403) throw e; } }
  };
  const downloads = {
    save: async ({ filename, data }) => {
      const blob = data instanceof Blob ? data : new Blob([data], { type: 'application/octet-stream' });
      const url = URL.createObjectURL(blob), a = document.createElement('a');
      a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 30000);
    }
  };

  const host = { use: async n => ({ user, db: { doc: docRef, collection: colRef }, assets, downloads })[n] || null, fileUrl };
  return { host, configured, hasToken, login, loadMe, logout, call, user, health: () => call('GET', '/health', undefined, { anon: true }), me: () => me };
})();

;
/* ============================================================
   main.js — inicialização
   ============================================================ */
async function startApp(host) {
  const get = async n => { try { return await host.use(n); } catch (e) { return null; } };
  const [user, db, downloads, assets] = await Promise.all([get('user'), get('db'), get('downloads'), get('assets')]);
  NS.user = user; NS.db = db; NS.downloads = downloads; NS.assets = assets; NS.fileUrl = host.fileUrl || null;
  if (!user || !db) { S.env = { ok: false, reason: 'none' }; render(); return; }
  try {
    UID = await user.id();
    if (!UID) throw new Error('sem id');
    try { const me = await user.me(); UI.userName = (me && me.name) || ''; } catch (e) { /* nome é opcional */ }
  } catch (e) { S.env = { ok: false, reason: 'none' }; render(); return; }
  S.env = { ok: true };
  let owner = false;
  try { owner = await user.isOwner(); } catch (e) { owner = false; }
  if (!owner) { S.mode = 'aluno'; startStudentSync(); render(); return; }
  startSync();
  startSubsSync();
  render();
}
(async function boot() {
  applyPrefs();
  if (window.__TEST_HOST) { render(); return startApp(window.__TEST_HOST); }
  if (!API.configured()) { S.env = { ok: false, reason: 'noapi' }; render(); return; }
  if (!API.hasToken()) { S.env = { ok: false, reason: 'login' }; render(); return; }
  render();
  try { await API.loadMe(); } catch (e) {
    if (e.code === 'revoked') return;
    S.env = { ok: false, reason: e.code === 'unavailable' ? 'offline' : 'login', detail: e.message }; render(); return;
  }
  await startApp(API.host);
})();

</script>
